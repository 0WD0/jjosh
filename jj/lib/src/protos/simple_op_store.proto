syntax = "proto3";

package simple_op_store;

message RefConflictLegacy {
  repeated bytes removes = 1 [deprecated = true];
  repeated bytes adds = 2 [deprecated = true];
}

// This is redundant with `RefTargetTerm`. It exists for historical reasons.
// TODO: Consider deprecating it.
message RefConflict {
  message Term {
    optional bytes value = 1;
  }
  repeated Term removes = 1;
  repeated Term adds = 2;
}

// RefTarget that may be serialized in legacy form.
message RefTarget {
  // New `RefConflict` type represents both `commit_id` and `conflict_legacy`.
  oneof value {
    bytes commit_id = 1 [deprecated = true];
    RefConflictLegacy conflict_legacy = 2 [deprecated = true];
    RefConflict conflict = 3;
  }
}

// RefTarget term that should be serialized in native form, in which positive
// and negative terms alternate.
message RefTargetTerm {
  optional bytes value = 1;
}

enum RemoteRefState {
  New = 0;
  Tracked = 1;
}

message RemoteBookmark {
  string remote_name = 1;
  RefTarget target = 2;
  // Introduced in jj 0.11.
  optional RemoteRefState state = 3;
}

message Bookmark {
  string name = 1;
  // Unset if the bookmark has been deleted locally.
  RefTarget local_target = 2;
  // Deprecated since jj 0.34.
  repeated RemoteBookmark remote_bookmarks = 3 [deprecated = true];
}

message GitRef {
  string name = 1;
  // This field is just for historical reasons (before we had the RefTarget
  // type). New GitRefs have (only) the target field.
  // TODO: Delete support for the old format.
  bytes commit_id = 2 [deprecated = true];
  RefTarget target = 3;
}

message GitHead {
  string name = 1;
  RefTarget target = 2;
}

message RemoteRef {
  string name = 1;
  repeated RefTargetTerm target_terms = 2;
  RemoteRefState state = 3;
}

message Tag {
  string name = 1;
  RefTarget target = 2;
}

// Configuration IDs use the same alternating positive/negative order as
// RefTargetTerm. An absent value represents an unregistered configuration.
message SparsePatternTerm {
  reserved 1; // Experimental string expression; never reinterpret as an ID.
  optional bytes value = 2;
}

message WcSparsePatterns {
  string name = 1;
  repeated SparsePatternTerm terms = 2;
  // Required discriminator: experimental expression-string entries used zero.
  uint32 version = 3;
}

message View {
  repeated bytes head_ids = 1;
  reserved 4;
  bytes wc_commit_id = 2 [deprecated = true];
  map<string, bytes> wc_commit_ids = 8;
  // Local bookmarks and remote bookmarks in legacy form.
  repeated Bookmark bookmarks = 5;
  repeated Tag local_tags = 6;
  // Introduced in jj 0.34.
  repeated RemoteView remote_views = 11;
  // Only a subset of the refs. For example, does not include refs/notes/.
  repeated GitRef git_refs = 3;
  // This field is just for historical reasons (before we had the RefTarget
  // type). New Views have (only) the target field.
  // TODO: Delete support for the old format.
  bytes git_head_legacy = 7 [deprecated = true];
  RefTarget git_head = 9 [deprecated = true];
  // Whether "@git" tags have been migrated to remote_views.
  bool has_git_refs_migrated_to_remote_tags = 12;
  // Per-workspace Git HEAD targets, keyed by workspace name.
  repeated GitHead git_heads = 13;
  // Desired sparse selections keyed by workspace, including unresolved merges.
  repeated WcSparsePatterns wc_sparse_patterns = 14;
  ProjectMetadata project_metadata = 15;
  reserved 10;
}

message RemoteView {
  string name = 1;
  repeated RemoteRef bookmarks = 2;
  repeated RemoteRef tags = 3;
}

message Operation {
  bytes view_id = 1;
  repeated bytes parents = 2;
  OperationMetadata metadata = 3;
  // Introduced in jj 0.30.
  repeated CommitPredecessors commit_predecessors = 4;
  // Whether or not `commit_predecessors` is recorded.
  bool stores_commit_predecessors = 5;
}

// TODO: Share with store.proto? Do we even need the timezone here?
message Timestamp {
  int64 millis_since_epoch = 1;
  int32 tz_offset = 2;
}

message OperationMetadata {
  Timestamp start_time = 1;
  Timestamp end_time = 2;
  string description = 3;
  string hostname = 4;
  string username = 5;
  bool is_snapshot = 7;
  optional string workspace_name = 8;
  map<string, string> attributes = 6;
}

message CommitPredecessors {
  bytes commit_id = 1;
  repeated bytes predecessor_ids = 2;
}

message ProjectMetadata {
  uint32 version = 1;
  repeated ProjectEntry projects = 2;
  repeated BindingEntry bindings = 3;
  repeated LabelEntry labels = 4;
  repeated ConnectionEntry connections = 5;
  repeated ObservationEntry observations = 6;
  repeated ScopedRemoteNameEntry remote_names = 7;
}

message ScopedRemoteName {
  bytes project_id = 1;
  string name = 2;
}

message ScopedRemoteNameTerm {
  ScopedRemoteName value = 1;
}

message ScopedRemoteNameEntry {
  bytes connection_id = 1;
  repeated ScopedRemoteNameTerm terms = 2;
}

message ProjectRecord {
  string name = 1;
  string canonical_root = 2;
}

message BindingRecord {
  optional bytes project_id = 1;
  bool repository_view = 2;
  bytes connection_id = 3;
  string provider = 4;
  uint32 version = 5;
  uint32 representation = 6;
  string expression = 7;
  optional string base = 8;
}

message ProjectTerm {
  ProjectRecord value = 1;
}

message BindingTerm {
  BindingRecord value = 1;
}

message IdTerm {
  optional bytes value = 1;
}

message ProjectEntry {
  bytes id = 1;
  repeated ProjectTerm terms = 2;
}

message BindingEntry {
  bytes id = 1;
  repeated BindingTerm terms = 2;
}

message LabelEntry {
  string label = 1;
  repeated IdTerm terms = 2;
}

message ConnectionEntry {
  string remote = 1;
  repeated IdTerm terms = 2;
}

message ConversionTerm {
  optional bytes canonical = 1;
  optional string raw = 2;
}

message ConversionObservation {
  bytes binding_id = 1;
  BindingRecord binding = 2;
  bytes connection_id = 3;
  string endpoint = 4;
  string raw_ref = 5;
  repeated ConversionTerm terms = 6;
  optional string base = 7;
  optional string generation = 8;
}

message ObservationTerm {
  ConversionObservation value = 1;
}
enum ObservationKind {
  OBSERVATION_KIND_UNKNOWN = 0;
  OBSERVATION_KIND_BOOKMARK = 1;
  OBSERVATION_KIND_TAG = 2;
  OBSERVATION_KIND_REVISION = 3;
}


message ObservationEntry {
  string remote = 1;
  string name = 2;
  reserved 3; // Experimental boolean discriminator cannot represent revision pins.
  repeated ObservationTerm terms = 4;
  ObservationKind kind = 5;
}
