[workspace]
resolver = "3"
members = ["crates/jjosh-cli"]
exclude = ["jj", "josh", "gitoxide"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/jj-vcs/jj"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6.5", features = ["derive"] }
gix-hash = { version = "0.26", features = ["sha1"] }
gix-object = "0.64.1"
josh-gix-object = { package = "gix-object", version = "0.63.0" }
gix-validate = "0.11.4"
jj-cli = { path = "jj/cli", default-features = false, features = ["git"] }
jj-lib = { path = "jj/lib", default-features = false, features = ["git"] }
josh-core = { path = "josh/josh-core" }
josh-cli = { path = "josh/josh-cli" }

[patch.crates-io]
gix                 = { path = "gitoxide/gix" }
gix-actor           = { path = "gitoxide/gix-actor" }
gix-attributes      = { path = "gitoxide/gix-attributes" }
gix-bitmap          = { path = "gitoxide/gix-bitmap" }
gix-chunk           = { path = "gitoxide/gix-chunk" }
gix-command         = { path = "gitoxide/gix-command" }
gix-commitgraph     = { path = "gitoxide/gix-commitgraph" }
gix-config          = { path = "gitoxide/gix-config" }
# Keep the registry gix-config-value for legacy gix-config 0.59;
# local gix-config uses its own path dependency with a newer API.
gix-date            = { path = "gitoxide/gix-date" }
gix-diff            = { path = "gitoxide/gix-diff" }
gix-discover        = { path = "gitoxide/gix-discover" }
gix-error           = { path = "gitoxide/gix-error" }
gix-features        = { path = "gitoxide/gix-features" }
gix-filter          = { path = "gitoxide/gix-filter" }
gix-fs              = { path = "gitoxide/gix-fs" }
gix-glob            = { path = "gitoxide/gix-glob" }
gix-hash            = { path = "gitoxide/gix-hash" }
gix-hashtable       = { path = "gitoxide/gix-hashtable" }
gix-ignore          = { path = "gitoxide/gix-ignore" }
gix-imara-diff      = { path = "gitoxide/gix-imara-diff" }
gix-index           = { path = "gitoxide/gix-index" }
gix-lock            = { path = "gitoxide/gix-lock" }
gix-macros          = { path = "gitoxide/gix-macros" }
gix-note            = { path = "gitoxide/gix-note" }
gix-object          = { path = "gitoxide/gix-object" }
gix-odb             = { path = "gitoxide/gix-odb" }
gix-pack            = { path = "gitoxide/gix-pack" }
gix-packetline      = { path = "gitoxide/gix-packetline" }
gix-path            = { path = "gitoxide/gix-path" }
gix-pathspec        = { path = "gitoxide/gix-pathspec" }
gix-protocol        = { path = "gitoxide/gix-protocol" }
gix-quote           = { path = "gitoxide/gix-quote" }
gix-ref             = { path = "gitoxide/gix-ref" }
gix-refspec         = { path = "gitoxide/gix-refspec" }
gix-revision        = { path = "gitoxide/gix-revision" }
gix-revwalk         = { path = "gitoxide/gix-revwalk" }
gix-sec             = { path = "gitoxide/gix-sec" }
gix-shallow         = { path = "gitoxide/gix-shallow" }
gix-submodule       = { path = "gitoxide/gix-submodule" }
gix-tempfile        = { path = "gitoxide/gix-tempfile" }
gix-trace           = { path = "gitoxide/gix-trace" }
gix-transport       = { path = "gitoxide/gix-transport" }
gix-traverse        = { path = "gitoxide/gix-traverse" }
gix-url             = { path = "gitoxide/gix-url" }
gix-utils           = { path = "gitoxide/gix-utils" }
gix-validate        = { path = "gitoxide/gix-validate" }
gix-worktree        = { path = "gitoxide/gix-worktree" }
gix-worktree-stream = { path = "gitoxide/gix-worktree-stream" }
gix-zlib            = { path = "gitoxide/gix-zlib" }
glob                = { path = "josh/vendor/rust-lang/glob" }
